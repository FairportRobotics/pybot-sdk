[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pybot-sdk"
version = "2026.10.10"
description = "Development tools for RobotPy robot projects"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = ["PyYAML>=6.0.2,<7", "jsonschema>=4.25,<5"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
pybot = "pybot_sdk.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.16"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "D", "SIM"]
ignore = ["D203", "D213"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pybot_sdk = [
    "hardware/schema/*.json",
    "templates/magicbot/*",
    "templates/magicbot/.github/workflows/*",
    "templates/magicbot/tests/*",
]