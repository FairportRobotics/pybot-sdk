name: SDK CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install .[test] robotpy==2026.2.2
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
      - run: pybot hardware validate src/pybot_sdk/templates/magicbot/config/hardware.yml
      - run: |
          pybot hardware generate src/pybot_sdk/templates/magicbot/config/hardware.yml --output /tmp/hardware_map.py
          cmp /tmp/hardware_map.py src/pybot_sdk/templates/magicbot/hardware_map.py
      - run: |
          pybot new /tmp/generated-robot --template magicbot
          cd /tmp/generated-robot
          robotpy test --no-isolation